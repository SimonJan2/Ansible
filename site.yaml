###############################################################
# MAKE SURE YOU CHANGE group_vars/all.yaml VARIABLES!!!!!!!!!!!
###############################################################

# Prepare all nodes: sysctl, Longhorn prereqs, /dev/sdb format+mount, K3s binary download
- name: Prepare all nodes
  hosts: k3s
  gather_facts: false
  become: true
  roles:
    - prepare-nodes
    - k3s-download

# Create the K3s manifest directory and drop the kube-vip DaemonSet manifest on kube-master-1
# so it is auto-applied when K3s bootstraps
- name: Deploy kube-vip
  hosts: servers
  gather_facts: true
  roles:
    - kube-vip

# Bootstrap kube-master-1, create systemd units for all servers and agents,
# wait for the node-token, distribute it as a fact, and copy the kubeconfig
- name: Prepare K3s on servers and agents
  hosts: servers,agents
  gather_facts: true
  roles:
    - k3s-prepare

# Join kube-master-2 and kube-master-3 to the cluster using the bootstrap token;
# apply kube-vip RBAC and cloud-controller manifests
- name: Add additional K3s servers
  hosts: servers
  gather_facts: true
  roles:
    - add-server

# Join all agent nodes to the cluster using the bootstrap token
- name: Add K3s agents
  hosts: agents
  gather_facts: true
  roles:
    - add-agent

# Wait for all server nodes to be Ready, then deploy MetalLB
# (L2Advertisement + IPAddressPool)
- name: Apply manifests after cluster is created
  hosts: servers
  gather_facts: true
  roles:
    - apply-manifests
