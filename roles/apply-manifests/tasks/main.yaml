# Wait for kube-master-1 to be ready before continuing with metallb deployment
- name: Wait for k8s nodes with node label 'server=true' to be ready
  ansible.builtin.command:
    cmd: "kubectl wait --for=condition=Ready nodes --selector server=true --timeout=600s"
  register: nodes_ready
  retries: 120
  delay: 10
  changed_when: true
  become_user: "{{ ansible_user }}"
  when: inventory_hostname == groups['servers'][0]

# Apply metallb manifest (namespace is included in metallb-native.yaml from v0.13+)
- name: Apply metallb manifest
  ansible.builtin.command:
    cmd: kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/{{ metallb_version }}/config/manifests/metallb-native.yaml
  become_user: "{{ ansible_user }}"
  changed_when: true
  when: inventory_hostname == groups['servers'][0]

# Wait for metallb deployment pods to be alive before deploying metallb manifests
- name: Wait for metallb pods to be ready
  ansible.builtin.command:
    cmd: "kubectl wait --namespace metallb-system --for=condition=ready pod --selector=component=controller --timeout=1800s"
  changed_when: true
  become_user: "{{ ansible_user }}"
  when: inventory_hostname == groups['servers'][0]

# Copy L2Advertisement manifest to server
- name: Copy metallb L2Advertisement to kube-master-1
  ansible.builtin.template:
    src: templates/metallb-l2advertisement.j2
    dest: /home/{{ ansible_user }}/l2advertisement.yaml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  when: inventory_hostname == groups['servers'][0]

# Apply L2 Advertisement for metallb
- name: Apply metallb L2Advertisement
  ansible.builtin.command:
    cmd: kubectl apply -f /home/{{ ansible_user }}/l2advertisement.yaml
  become_user: "{{ ansible_user }}"
  changed_when: true
  when: inventory_hostname == groups['servers'][0]

# Deploy metal IP Pool to kube-master-1
- name: Copy metallb IPPool to kube-master-1
  ansible.builtin.template:
    src: templates/metallb-ippool.j2
    dest: /home/{{ ansible_user }}/ippool.yaml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  when: inventory_hostname == groups['servers'][0]

- name: Apply metallb IPPool
  ansible.builtin.command:
    cmd: kubectl apply -f /home/{{ ansible_user }}/ippool.yaml
  become_user: "{{ ansible_user }}"
  changed_when: true
  when: inventory_hostname == groups['servers'][0]
