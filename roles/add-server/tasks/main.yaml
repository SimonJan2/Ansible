# Deploy join config to kube-master-2 and kube-master-3 (not the bootstrap node)
- name: Deploy K3s server join configuration
  ansible.builtin.template:
    src: templates/k3s-server-config.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname != groups['servers'][0]

# Wait for the API on kube-master-1 before joining additional servers
- name: Wait for cluster API to be ready (can take 5-10 mins depending on hardware/internet)
  ansible.builtin.command:
    cmd: "kubectl get nodes"
  register: kubectl_output
  until: "'connection refused' not in kubectl_output.stderr"
  retries: 120
  delay: 10
  changed_when: true
  become_user: "{{ ansible_user }}"
  when: inventory_hostname == groups['servers'][0]

# Apply kube-vip RBAC so kube-vip pods can use the leader-election API
- name: Apply kube-vip RBAC manifest
  ansible.builtin.command:
    cmd: kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml apply -f https://kube-vip.io/manifests/rbac.yaml
  changed_when: true
  when: inventory_hostname == groups['servers'][0]

# Apply the kube-vip cloud controller for LoadBalancer IP assignment via kube-vip
- name: Apply kube-vip cloud controller manifest
  ansible.builtin.command:
    cmd: kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml apply -f https://raw.githubusercontent.com/kube-vip/kube-vip-cloud-provider/main/manifest/kube-vip-cloud-controller.yaml
  changed_when: true
  when: inventory_hostname == groups['servers'][0]

# Start the additional server nodes so they join the cluster
- name: Ensure additional K3s servers are enabled and running
  ansible.builtin.systemd:
    name: k3s-server
    enabled: true
    state: restarted
    daemon_reload: true
  when: inventory_hostname != groups['servers'][0]

# Wait for this server's own kubeconfig to be written after joining the cluster
- name: Wait for kubeconfig on additional servers
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
  when: inventory_hostname != groups['servers'][0]

- name: Copy kubeconfig to user home directory on additional servers
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    mode: "u=rw,g=,o="
  when: inventory_hostname != groups['servers'][0]

# Point at the kube-vip VIP so kubectl keeps working from this master
# regardless of which node currently holds the control-plane VIP
- name: Replace loopback address in kubeconfig with kube-vip VIP on additional servers
  ansible.builtin.replace:
    path: "/home/{{ ansible_user }}/.kube/config"
    regexp: '127\.0\.0\.1'
    replace: "{{ vip }}"
  when: inventory_hostname != groups['servers'][0]
