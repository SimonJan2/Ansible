# Copy agent join config to all agent nodes
- name: Deploy K3s agent configuration
  ansible.builtin.template:
    src: templates/k3s-agent-config.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname in groups['agents']

# Start agents — they will connect to the bootstrap server and join the cluster
- name: Ensure K3s agents are enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: restarted
    daemon_reload: true
